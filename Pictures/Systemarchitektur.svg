<svg viewBox="0 0 700 470" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 z" fill="#3b6d11"/></marker>
    <marker id="an" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 z" fill="#5f5e5a"/></marker>
  </defs>

  <rect x="0" y="0" width="700" height="470" fill="#ffffff"/>

  <!-- Remote client -->
  <rect x="8" y="42" width="124" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
  <text x="70" y="66" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2c2c2a">Remote-Client</text>
  <text x="70" y="83" font-size="10.5" text-anchor="middle" fill="#5f5e5a">WireGuard-App</text>

  <!-- LAN client -->
  <rect x="8" y="360" width="124" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
  <text x="70" y="384" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2c2c2a">LAN-Client</text>
  <text x="70" y="401" font-size="10.5" text-anchor="middle" fill="#5f5e5a">im Heimnetz</text>

  <!-- Router -->
  <rect x="152" y="55" width="112" height="62" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
  <text x="208" y="80" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2c2c2a">Router (UniFi)</text>
  <text x="208" y="97" font-size="10.5" text-anchor="middle" fill="#5f5e5a">UDP 51820</text>

  <!-- Legend box (placed in empty left-middle area) -->
  <rect x="14" y="184" width="234" height="92" rx="8" fill="#faf9f5" stroke="#d3d1c7" stroke-width="0.8"/>
  <text x="28" y="206" font-size="11" font-weight="bold" text-anchor="start" fill="#2c2c2a">Legende</text>
  <line x1="28" y1="230" x2="52" y2="230" stroke="#3b6d11" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="62" y="234" font-size="10" text-anchor="start" fill="#2c2c2a">WireGuard-Tunnel (verschlüsselt)</text>
  <line x1="28" y1="256" x2="52" y2="256" stroke="#5f5e5a" stroke-width="2.5" marker-end="url(#an)"/>
  <text x="62" y="260" font-size="10" text-anchor="start" fill="#2c2c2a">lokaler / interner HTTP(S)-Verkehr</text>

  <!-- Host container -->
  <rect x="290" y="24" width="402" height="432" rx="18" fill="#f7f6f1" stroke="#5f5e5a" stroke-width="0.8"/>
  <text x="491" y="46" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2c2c2a">Proxmox VE Host</text>
  <text x="491" y="61" font-size="10" text-anchor="middle" fill="#5f5e5a">gemeinsamer Linux-Kernel</text>

  <!-- WG LXC -->
  <rect x="310" y="74" width="362" height="60" rx="10" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.8"/>
  <text x="491" y="98" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#27500a">WireGuard-LXC</text>
  <text x="491" y="115" font-size="10.5" text-anchor="middle" fill="#3b6d11">Peer wg0 - entschlüsselt den Tunnel</text>

  <!-- Jellyfin LXC -->
  <rect x="310" y="158" width="362" height="184" rx="12" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
  <text x="491" y="179" font-size="12" font-weight="bold" text-anchor="middle" fill="#26215c">Jellyfin-LXC (unprivilegiert)</text>

  <rect x="330" y="194" width="322" height="46" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
  <text x="491" y="213" font-size="12" font-weight="bold" text-anchor="middle" fill="#04342c">Jellyfin Server</text>
  <text x="491" y="229" font-size="10" text-anchor="middle" fill="#0f6e56">.NET · Web-Client · REST-API</text>

  <rect x="330" y="256" width="152" height="66" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.8"/>
  <text x="406" y="282" font-size="12" font-weight="bold" text-anchor="middle" fill="#042c53">SQLite</text>
  <text x="406" y="299" font-size="10" text-anchor="middle" fill="#185fa5">eingebettete DB</text>

  <rect x="500" y="256" width="152" height="66" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.8"/>
  <text x="576" y="282" font-size="12" font-weight="bold" text-anchor="middle" fill="#412402">FFmpeg</text>
  <text x="576" y="299" font-size="10" text-anchor="middle" fill="#854f0b">HW-Transcoding</text>

  <!-- Media + GPU -->
  <rect x="330" y="366" width="152" height="54" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
  <text x="406" y="389" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c2c2a">Mediathek</text>
  <text x="406" y="405" font-size="10" text-anchor="middle" fill="#5f5e5a">Bind-Mount</text>

  <rect x="500" y="366" width="152" height="54" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
  <text x="576" y="389" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c2c2a">GPU /dev/dri</text>
  <text x="576" y="405" font-size="10" text-anchor="middle" fill="#5f5e5a">Passthrough</text>

  <!-- Arrows -->
  <line x1="132" y1="64" x2="150" y2="76" stroke="#3b6d11" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="264" y1="82" x2="308" y2="98" stroke="#3b6d11" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="491" y1="134" x2="491" y2="156" stroke="#5f5e5a" stroke-width="1.6" marker-end="url(#an)"/>
  <line x1="132" y1="386" x2="308" y2="235" stroke="#5f5e5a" stroke-width="1.6" marker-end="url(#an)"/>
  <line x1="406" y1="364" x2="406" y2="344" stroke="#5f5e5a" stroke-width="1.6" marker-end="url(#an)"/>
  <line x1="576" y1="364" x2="576" y2="324" stroke="#5f5e5a" stroke-width="1.6" marker-end="url(#an)"/>
</svg>
